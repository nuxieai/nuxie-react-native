apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

def pins = new groovy.json.JsonSlurper().parse(file('../NATIVE-PINS.json'))
android {
  namespace 'ai.nuxie.reactnative'
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig { minSdk 24 }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
}
react { jsRootDir = file('../src'); libraryName = 'NuxieSpec'; codegenJavaPackageName = 'ai.nuxie.reactnative' }
// AAR and POM are built from the exact pin; npm consumers need no private Maven registry.
def artifactVersion = "0.2.0-${pins.android.revision}"
def artifactBase = file("maven/ai/nuxie/nuxie-android/${artifactVersion}/nuxie-android-${artifactVersion}")
if (!file("${artifactBase}.pom").exists()) throw new GradleException('Nuxie native artifact missing; maintainers must run scripts/prepare-native.py before packing')
def nativePom = new groovy.xml.XmlSlurper().parse(file("${artifactBase}.pom"))
dependencies {
  implementation 'com.facebook.react:react-android'
  implementation files("${artifactBase}.aar")
  nativePom.dependencies.dependency.each { dependency ->
    implementation "${dependency.groupId}:${dependency.artifactId}:${dependency.version}"
  }
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
